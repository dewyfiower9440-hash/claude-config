name: ci
on: [push, pull_request]
permissions:
  contents: read
# A newer push to the same branch replaces the run of the older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hooks:
    runs-on: windows-latest
    # The gate takes about 12 minutes here; a run that hangs is ended instead of using 6 hours.
    timeout-minutes: 30
    steps:
      # Actions are pinned to commits (a tag can be moved); the comment names the tag.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python, ruff and PSScriptAnalyzer
        shell: pwsh
        run: |
          uv python install 3.13
          uv tool install ruff==0.17.3
          uv tool dir --bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          powershell -NoProfile -Command "Install-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser"
      # The guard reads a pattern such as ~/.c?aude by expanding it on disk, as the shell
      # does; every real machine has ~/.claude (the live configuration), the runner has not,
      # so the guard tests of those patterns need the folder to exist here.
      - name: Create the live configuration folder the guard tests expect
        shell: pwsh
        run: New-Item -ItemType Directory -Force (Join-Path $HOME ".claude/hooks") | Out-Null
      - name: Quality gate (same command as the local gate in CLAUDE.md)
        shell: pwsh
        env:
          # The runner has few cores and no 600 s limit: fewer modules at a time keeps each
          # one fast enough for the time budgets its tests rely on. Locally the default runs.
          GATE_WORKERS: "4"
        run: |
          $py = uv python find 3.13
          & $py -I tests/run_all.py
          if ($LASTEXITCODE -ne 0) { throw "quality gate failed" }
